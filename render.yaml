services:
  - type: web
    name: news-mood
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: OPENROUTER_API_KEY
        sync: false          # вставьте значение в Render Dashboard → Environment
      - key: OPENROUTER_MODEL
        value: deepseek/deepseek-v4-flash
      - key: GOOGLE_NEWS_QUERY
        value: ""
      - key: NEWS_FETCH_LIMIT
        value: "15"
      - key: DB_PATH
        value: news.db        # см. README про персистентность на бесплатном плане
      - key: APP_URL
        sync: false          # укажите ваш итоговый *.onrender.com URL после первого деплоя
    # Бесплатный план Render не даёт постоянный диск — файловая система
    # сбрасывается при каждом новом деплое. Приложение переживает это
    # штатно: при старте оно само подгружает новости, если база пустая.
    # Чтобы кэш переписанных новостей не терялся между деплоями,
    # раскомментируйте disk ниже (платный план) и смените DB_PATH на
    # /var/data/news.db:
    # disk:
    #   name: news-mood-data
    #   mountPath: /var/data
    #   sizeGB: 1
