<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Настроение новостей</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="style.css" />
</head>
<body>

<header class="topbar">
  <div class="brand">
    <span class="brand-mark" aria-hidden="true"></span>
    <div>
      <h1>Настроение новостей</h1>
      <p class="tagline">Реальные новости. Факты те же — тон другой.</p>
    </div>
  </div>

  <div class="mood-dial" role="group" aria-label="Выбор настроения">
    <button class="mood-tab" data-mood="нейтрально" data-active="true">нейтрально</button>
    <button class="mood-tab" data-mood="радостно">радостно</button>
    <button class="mood-tab" data-mood="грустно">грустно</button>
    <button class="mood-tab" data-mood="иронично">иронично</button>
    <form class="mood-custom" id="customMoodForm">
      <input type="text" id="customMoodInput" placeholder="свой стиль…" maxlength="60" />
      <button type="submit" aria-label="Применить свой стиль">→</button>
    </form>
  </div>
</header>

<main>
  <div id="status" class="status" hidden></div>
  <section id="grid" class="grid" aria-live="polite"></section>
</main>

<div id="overlay" class="overlay" hidden>
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <button class="modal-close" id="modalClose" aria-label="Закрыть">×</button>

    <div class="modal-head">
      <span class="modal-source" id="modalSource"></span>
      <h2 id="modalTitle"></h2>
      <a id="modalLink" href="#" target="_blank" rel="noopener">Читать в источнике →</a>
    </div>

    <div class="modal-mood-row">
      <span>Тон:</span>
      <div class="mood-dial mood-dial--modal" id="modalMoodDial">
        <button class="mood-tab" data-mood="нейтрально">нейтрально</button>
        <button class="mood-tab" data-mood="радостно">радостно</button>
        <button class="mood-tab" data-mood="грустно">грустно</button>
        <button class="mood-tab" data-mood="иронично">иронично</button>
      </div>
    </div>

    <div class="compare">
      <div class="pane">
        <h3>Оригинал</h3>
        <p id="paneOriginal"></p>
      </div>
      <div class="pane pane--rewritten">
        <h3>Переписано <span id="factBadge" class="fact-badge"></span></h3>
        <p id="paneRewritten"></p>
        <div id="factDetails" class="fact-details" hidden></div>
      </div>
    </div>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
